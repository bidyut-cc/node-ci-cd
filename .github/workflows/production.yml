name: Auto Merge & Deploy to Production

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

jobs:
  check-and-merge:
    runs-on: [self-hosted, ec2-production]
    outputs:
      merged: ${{ steps.merge.outputs.merged }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Auto Merge Staging → Main
        id: merge
        run: |
          git fetch origin
          git checkout main
          if git merge-base --is-ancestor origin/staging origin/main; then
            echo "merged=false" >> $GITHUB_OUTPUT
          else
            git config user.name "CI Bot"
            git config user.email "ci@example.com"
            git merge origin/staging -m "Auto merge from staging to main"
            git push origin main
            echo "merged=true" >> $GITHUB_OUTPUT
          fi

  deploy-prod:
    needs: check-and-merge
    if: needs.check-and-merge.outputs.merged == 'true'
    runs-on: [self-hosted, ec2-prod]

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Set up .env
        run: |
          echo "${{ secrets.PROD_ENV_FILE }}" > .env

      - name: Restart App with PM2
        run: pm2 restart BackendAPI
