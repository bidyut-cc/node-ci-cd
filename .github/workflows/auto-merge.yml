name: Auto Merge Staging to Main

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes (UTC time)
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "codeclouds-bidyut"
          git config --global user.email "bidyut.patra@codeclouds.com"

      - name: Fetch and Check Differences
        run: |
          git fetch origin
          git checkout main
          git pull origin main

          echo "Checking for differences between staging and main..."
          if git merge-base --is-ancestor origin/staging origin/main; then
            echo "✅ No new commits to merge from staging."
            exit 0
          fi

          echo "🔁 Merging staging into main..."
          git merge origin/staging -m "Auto merge staging → main"

      - name: Push changes to main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "🔐 Setting up remote with PAT"
          git remote set-url origin https://${GH_PAT}@github.com/${{ github.repository }}

          echo "🚀 Pushing changes..."
          git push origin main
