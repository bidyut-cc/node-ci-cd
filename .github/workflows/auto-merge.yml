name: Auto Merge Staging to Main

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # Needed for dispatching other workflows

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "codeclouds-bidyut"
          git config --global user.email "bidyut.patra@codeclouds.com"

      - name: Merge staging → main if needed
        run: |
          git fetch origin
          git checkout main
          git pull origin main

          echo "Checking for differences between staging and main..."
          if git merge-base --is-ancestor origin/staging origin/main; then
            echo "✅ No new commits to merge from staging."
            exit 0
          fi

          echo "🔁 Merging staging into main..."
          git merge origin/staging -m "Auto merge staging → main"

      - name: Push changes using GITHUB_TOKEN
        run: |
          echo "🚀 Pushing changes to main..."
          git push origin main

      - name: Trigger Deploy to Production
        run: |
          echo "🚀 Triggering Deploy to Production workflow..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
